# Direct 60-minute arrival-time surrogate. All values are explicitly tunable.
data_dir: data_arrival          # Directories: train/, val/, test/, one NPZ per simulation
output_dir: outputs_arrival    # New/empty directory; never overwrite a training run
grid_size: 320                 # Side length; must divide evenly by 2**depth
horizon_seconds: 3600.0        # ForeFire simulation duration, seconds
unreached_sentinel: -9999.0    # Numeric arrival-time value for cells not reached
channel_names:                # Order MUST match NPZ x and its channel_names
  - ignition_mask
  - wind_u_mps
  - wind_v_mps
  - fuel_moisture
channel_types:                # binary or continuous; categorical fuel needs one-hot channels
  - binary
  - continuous
  - continuous
  - continuous
ignition_channel: ignition_mask
base_filters: 16               # Try 8,16,32; larger requires more VRAM
depth: 3                       # 2–4; grid_size divisible by 2**depth
dropout: 0.0                   # Try 0–0.2
batch_size: 4                  # Reduce on out-of-memory
epochs: 30
learning_rate: 0.001           # Try 0.0001–0.001
weight_decay: 0.0001
burn_loss_weight: 1.0          # BCE for reached-within-horizon classification
arrival_loss_weight: 1.0       # Smooth L1 loss on cells reached within horizon
positive_weight: 1.0          # BCE positive-class weight, try 1–10 if fire cells rare
threshold: 0.5                # Classification threshold for IoU/Dice
random_seed: 42
device: auto                   # auto, cpu or cuda
num_workers: 0
