name: Ember Observatory checks

on:
  push:
    branches: [feature/ember-observatory]
  pull_request:
    paths:
      - 'ml/**'
      - 'orchestration/observe/**'
      - 'orchestration/fuzzball/execute_training.py'
      - 'notebooks/**'
      - 'scripts/export_observatory.py'
      - 'scripts/test_*observatory.py'
      - 'scripts/test_arrival_checkpoint.py'
      - '.github/workflows/ember-observatory.yml'

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline visualization dependencies
        run: python -m pip install numpy matplotlib pandas PyYAML nbformat nbconvert
      - name: Compile Python source
        run: |
          python -m compileall -q ml/observability.py ml/train_arrival.py ml/train_arrival_ddp.py ml/export_gallery.py orchestration/observe orchestration/fuzzball/execute_training.py
      - name: Validate the notebook document
        run: |
          python - <<'PY'
          import nbformat
          nb = nbformat.read("notebooks/Ember_Observatory.ipynb", as_version=4)
          nbformat.validate(nb)
          print("Validated notebook cells:", len(nb.cells))
          PY
      - name: Run offline contract tests
        run: python -m unittest scripts.test_export_observatory orchestration.observe.test_observatory orchestration.observe.test_manual -v
      - name: Install CPU-only ML regression dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check checkpoint identities and original ML contract
        run: |
          python -m unittest scripts.test_arrival_checkpoint -v
          cd ml
          python -m unittest test_contract -v
